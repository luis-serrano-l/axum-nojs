name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    # Blitz (loco-ui-test) finds fonts through fontconfig.
    - name: System libraries
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

    - name: Format
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets
    # The library must build clean with no features and with only `http`.
    - name: Clippy (feature levels)
      run: |
        cargo clippy -p loco-ui --all-targets
        cargo clippy -p loco-ui --features http --all-targets
        cargo clippy -p loco-ui --features loco --all-targets
    - name: Tests
      run: |
        cargo test --workspace
        cargo test -p loco-ui --features loco loco
        cargo test -p loco-ui --features loco --doc loco
        cargo test -p loco-ui --test install -- --include-ignored
    # The enhancement script in headless Firefox, then axe-core on every route (fails on any
    # serious or critical violation). The runner image has Firefox and geckodriver.
    - name: Browser check and accessibility
      run: |
        cargo build -p demo
        npm install --prefix scripts --no-audit --no-fund
        node scripts/browser-check.mjs
    - name: Rustdoc
      run: cargo doc --no-deps -p loco-ui-caps -p loco-ui-macros -p loco-ui --all-features
      env:
        RUSTDOCFLAGS: -D warnings
