name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    # Blitz (axum-nojs-test) finds fonts through fontconfig.
    - name: System libraries
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

    - name: Format
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets
    # The library must build clean with no features and with only `http`.
    - name: Clippy (feature levels)
      run: |
        cargo clippy -p axum-nojs --all-targets
        cargo clippy -p axum-nojs --features http --all-targets
    - name: Tests
      run: cargo test --workspace
    - name: Rustdoc
      run: cargo doc --no-deps -p axum-nojs-caps -p axum-nojs --all-features
      env:
        RUSTDOCFLAGS: -D warnings
