[workspace]
members = ["axum-nojs-caps", "axum-nojs", "demo", "axum-nojs-test", "examples/loco-app", "examples/loco-app/migration"]
resolver = "2"

[workspace.dependencies]
maud = { version = "0.27", features = ["axum"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }

# Smallest, fastest demo binary for `scripts/bench.sh`; tests and `cargo run` keep the dev profile.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
