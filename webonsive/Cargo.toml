[package]
name = "webonsive"
version = "0.1.0"
edition = "2024"
description = "Zero-JavaScript interactive HTML components for Rust servers"

[features]
default = []
# Axum glue: `Caps` extractor, the `/wo/caps` beacon route, streaming responses.
axum = ["dep:axum", "dep:futures-util", "dep:bytes"]

[dependencies]
maud.workspace = true
axum = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
bytes = { version = "1", optional = true }

[dev-dependencies]
axum.workspace = true
tokio.workspace = true

[[example]]
name = "axum_server"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true
