[package]
name = "loco-ui-macros"
version = "0.1.0"
edition = "2024"
description = "The `lui!` macro for loco-ui: Maud markup where components are written like elements"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/luis-serrano-l/loco-ui"
keywords = ["maud", "ssr", "components", "axum"]
categories = ["web-programming", "template-engine"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
loco-ui = { path = "../loco-ui" }
maud.workspace = true
trybuild = "1"
