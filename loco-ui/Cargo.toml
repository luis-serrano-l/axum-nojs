[package]
name = "loco-ui"
version = "0.1.0"
edition = "2024"
description = "Server-rendered UI components for Loco and Axum, in Maud with a shadcn look: HTML first, every page works with JavaScript off, one optional script"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/luis-serrano-l/loco-ui"
keywords = ["maud", "ssr", "components", "axum"]
categories = ["web-programming", "template-engine", "gui"]
# The `loco new` copy `tests/install.rs` runs the installer on.
exclude = ["tests/fresh-loco-app"]

[features]
default = []
# Framework-neutral responses: `prg` as an `http::Response`, `Streamed` as a chunk stream.
http = ["dep:http", "dep:futures-util"]
# Axum glue on top of `http`: extractors, the `/lui/caps` beacon route, `IntoResponse` impls.
# `Saved<T>` keeps a serde value in a cookie.
axum = ["http", "dep:axum", "dep:bytes", "dep:serde", "dep:serde_urlencoded", "dep:form_urlencoded", "loco-ui-caps/axum"]
# Loco on top of `axum`: an initializer that mounts `/lui/enhance.js` and `/lui/caps`.
loco = ["axum", "dep:loco-rs", "dep:async-trait"]

[dependencies]
maud.workspace = true
loco-ui-caps = { path = "../loco-ui-caps", version = "0.1.0" }
loco-ui-macros = { path = "../loco-ui-macros", version = "0.1.0" }
http = { version = "1", optional = true }
axum = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
bytes = { version = "1", optional = true }
serde = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
form_urlencoded = { version = "1", optional = true }
loco-rs = { version = "1.2", optional = true, default-features = false }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
serde.workspace = true
axum.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
# Loco apps derive `Validate` themselves; the `loco` doctests do the same.
validator = { version = "0.20", features = ["derive"] }
# The SeaORM paging example in `loco` runs against a mock database.
sea-orm = { version = "2.0", default-features = false, features = ["mock", "macros", "with-json"] }
# `testing` for `tests_cfg::app::get_app_context`: the flash test runs Loco's default middleware.
loco-rs = { version = "1.2", default-features = false, features = ["testing"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render"
harness = false

[[example]]
name = "axum_server"
required-features = ["axum"]

[[example]]
name = "hyper_server"
required-features = ["http"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
