<svg viewBox="0 0 1280 840" width="1280" height="840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">loco-ui, in layers</title>
  <desc id="layers-desc">Layer stack of loco-ui: the HTML and CSS platform at the bottom, then primitives such as buttons and inputs, components such as dialogs and tables built from them, widgets such as the calendar and kanban board, and at the top components you write in your own crate; everything renders on the server with no JavaScript required.</desc>
  <defs>
    <marker id="layers-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#4f5d75"/>
    </marker>
    <style>
      .eyebrow { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 18px; font-weight: 600; letter-spacing: 0.18em; fill: #2d3142; }
      .name { font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif; font-size: 24px; font-weight: 600; fill: #2d3142; }
      .sub { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 22px; font-weight: 500; fill: #2d3142; }
      .note { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #2d3142; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Heading -->
  <text x="200" y="72" class="eyebrow">LOCO-UI · EACH LAYER IS BUILT FROM THE ONES BELOW</text>

  <!-- Direction indicator in the left margin (drawn before the bands) -->
  <line x1="124" y1="672" x2="124" y2="136" stroke="#4f5d75" stroke-width="2" marker-end="url(#layers-arrow)"/>
  <text x="124" y="116" class="eyebrow" text-anchor="middle">COMPOSES</text>

  <!-- L4 · Yours (focal) -->
  <rect x="200" y="112" width="1040" height="112" fill="#f5f5f5"/>
  <rect x="200" y="112" width="1040" height="112" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2"/>
  <text x="228" y="172" class="eyebrow" fill="#eb6c36" style="fill:#eb6c36">L4</text>
  <text x="320" y="160" class="name">Yours</text>
  <text x="320" y="200" class="sub">ui.pricing_card() — a trait on Ui, in your crate</text>

  <!-- L3 · Widgets -->
  <rect x="200" y="224" width="1040" height="112" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="228" y="284" class="eyebrow">L3</text>
  <text x="320" y="272" class="name">Widgets</text>
  <text x="320" y="312" class="sub">calendar · date_picker · upload · kanban</text>

  <!-- L2 · Components -->
  <rect x="200" y="336" width="1040" height="112" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="228" y="396" class="eyebrow">L2</text>
  <text x="320" y="384" class="name">Components</text>
  <text x="320" y="424" class="sub">dialog · menu · tabs · table · form · wizard</text>

  <!-- L1 · Primitives -->
  <rect x="200" y="448" width="1040" height="112" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="228" y="508" class="eyebrow">L1</text>
  <text x="320" y="496" class="name">Primitives</text>
  <text x="320" y="536" class="sub">button · input · card · badge · Icon · stack</text>

  <!-- L0 · The platform (external) -->
  <rect x="200" y="560" width="1040" height="112" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="228" y="620" class="eyebrow">L0</text>
  <text x="320" y="608" class="name">HTML and CSS</text>
  <text x="320" y="648" class="sub">&lt;dialog&gt; · popover · &lt;details&gt; · forms</text>

  <!-- Outer silhouette -->
  <rect x="200" y="112" width="1040" height="560" fill="none" stroke="#2d3142" stroke-width="1.5"/>
  <rect x="200" y="112" width="1040" height="112" fill="none" stroke="#eb6c36" stroke-width="2"/>

  <!-- Bottom strip: the one sentence the picture leaves out -->
  <line x1="200" y1="716" x2="1240" y2="716" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="200" y="760" class="note">Every layer renders on the server and works with JavaScript off.</text>
  <text x="200" y="796" class="note">One optional script, /lui/enhance.js, updates the same markup in place.</text>
</svg>
