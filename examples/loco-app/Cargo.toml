[package]
name = "loco-app"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "loco_app-cli"

[dependencies]
axum-nojs = { path = "../../axum-nojs", features = ["loco"] }
maud = { workspace = true }
loco-rs = { version = "1.2", default-features = false, features = ["auth", "cli", "with-db", "db-sqlite"] }
migration = { path = "migration" }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
chrono = "0.4"
validator = "0.20"
uuid = { version = "1.6", features = ["v4"] }

[[bin]]
name = "loco_app-cli"
path = "src/bin/main.rs"

[dev-dependencies]
loco-rs = { version = "1.2", default-features = false, features = ["testing", "auth", "with-db", "db-sqlite"] }
axum-nojs-test = { path = "../../axum-nojs-test" }
tower = { version = "0.5", features = ["util"] }
serial_test = "3.1"
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
