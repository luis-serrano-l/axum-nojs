logger:
  enable: true
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost
  middlewares: {}

workers:
  # No background jobs in this app.
  mode: ForegroundBlocking

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://loco_app_development.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

mailer:
  # The account pages mail links (verify, reset, magic link). Mailpit or MailHog on 1025
  # shows them: `docker run -p 1025:1025 -p 8025:8025 axllent/mailpit`.
  smtp:
    enable: true
    host: localhost
    port: 1025
    secure: false

auth:
  jwt:
    # Loco's auth::JWT reads the token from the cookie the sign-in form sets.
    location:
      from: Cookie
      name: auth
    secret: WWxGqUZ6oWSH08cboJdj
    expiration: 604800 # 7 days
