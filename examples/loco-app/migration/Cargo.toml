[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
loco-rs = { version = "1.2", default-features = false, features = ["with-db"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls"] }
